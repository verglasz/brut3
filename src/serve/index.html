<!doctype html>
<!--
  Play page served by `ultimate-ttt-burn serve`. Board styles, colours and icons are taken from
  uttt.ai (utttai/website, Apache-2.0); the markup and script are written for this server.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Tic-Tac-Toe</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
[data-theme='light'] {
  --website-bg-color: rgb(255, 255, 255);
  --fg-color: rgb(62, 65, 69);
  --muted-color: rgb(140, 143, 147);
  --nav-border-color: rgb(244, 244, 244);
  --control-bg-color: rgb(255, 255, 255);
  --control-border-color: rgb(216, 216, 216);
  --control-hover-bg-color: rgb(249, 249, 249);
  --error-color: rgb(200, 0, 0);
  --undoredo-bg-color: rgb(255, 255, 255);
  --undoredo-fg-color: rgb(62, 65, 69);
  --undoredo-hover-bg-color: rgb(249, 249, 249);
  --undoredo-hover-fg-color: rgb(52, 54, 57);
  --undoredo-active-bg-color: rgb(242, 242, 242);
  --undoredo-disabled-color: rgb(239, 239, 239);
  --num-moves-color: rgb(62, 65, 69);
  --supergame-bg-color: rgb(255, 255, 255);
  --subgame-border-color: rgb(0, 0, 0);
  --square-border-color: rgba(0, 0, 0, 0.25);
  --square-probability-color: rgb(8, 8, 8);
  --square-probability-top-color: rgb(0, 0, 0);
  --x-square-legal-color: rgb(227, 242, 253);
  --x-square-hover-color: rgb(187, 222, 251);
  --x-subgame-result-bg-color: rgb(144, 202, 249);
  --x-square-symbol-color: rgb(33, 150, 243);
  --x-square-outline-color: rgb(33, 150, 243);
  --x-status-color: rgb(30, 136, 229);
  --x-subgame-symbol-color: rgb(22, 118, 194);
  --o-square-legal-color: rgb(252, 228, 236);
  --o-square-hover-color: rgb(248, 187, 208);
  --o-subgame-result-bg-color: rgb(244, 143, 177);
  --o-square-symbol-color: rgb(233, 30, 99);
  --o-square-outline-color: rgb(233, 30, 99);
  --o-status-color: rgb(216, 27, 96);
  --o-subgame-symbol-color: rgb(207, 28, 89);
  --draw-subgame-result-bg-color: rgb(255, 245, 157);
  --draw-subgame-symbol-color: rgb(196, 180, 44);
  --draw-status-color: rgb(0, 0, 0);
}

[data-theme='dark'] {
  --website-bg-color: rgb(34, 39, 46);
  --fg-color: rgb(223, 225, 227);
  --muted-color: rgb(119, 125, 131);
  --nav-border-color: rgb(62, 65, 69);
  --control-bg-color: rgb(43, 46, 50);
  --control-border-color: rgb(83, 85, 87);
  --control-hover-bg-color: rgb(49, 51, 55);
  --error-color: rgb(255, 110, 110);
  --undoredo-bg-color: rgb(34, 39, 46);
  --undoredo-fg-color: rgb(203, 205, 207);
  --undoredo-hover-bg-color: rgb(39, 44, 51);
  --undoredo-hover-fg-color: rgb(223, 225, 227);
  --undoredo-active-bg-color: rgb(44, 48, 53);
  --undoredo-disabled-color: rgb(62, 65, 69);
  --num-moves-color: rgb(204, 205, 206);
  --supergame-bg-color: rgb(37, 42, 49);
  --subgame-border-color: rgba(255, 255, 255, 0.3);
  --square-border-color: rgba(255, 255, 255, 0.15);
  --square-probability-color: rgb(245, 245, 245);
  --square-probability-top-color: rgb(250, 250, 250);
  --x-square-legal-color: rgb(35, 55, 72);
  --x-square-hover-color: rgb(32, 73, 108);
  --x-subgame-result-bg-color: rgb(23, 64, 98);
  --x-square-symbol-color: rgb(19, 115, 190);
  --x-square-outline-color: rgb(19, 115, 190);
  --x-status-color: rgb(33, 121, 195);
  --x-subgame-symbol-color: rgb(29, 126, 176);
  --o-square-legal-color: rgb(68, 37, 56);
  --o-square-hover-color: rgb(111, 29, 65);
  --o-subgame-result-bg-color: rgb(86, 22, 50);
  --o-square-symbol-color: rgb(174, 9, 73);
  --o-square-outline-color: rgb(174, 9, 73);
  --o-status-color: rgb(187, 0, 76);
  --o-subgame-symbol-color: rgb(166, 44, 86);
  --draw-subgame-result-bg-color: rgb(66, 66, 66);
  --draw-subgame-symbol-color: rgb(114, 114, 114);
  --draw-status-color: rgb(203, 205, 207);
}

:root {
  /* One board square; the board is 9 squares plus 2 x 3 px and 6 x 1 px of lines. */
  --sq: clamp(22px, calc((min(100vw - 32px, 100vh - 240px) - 12px) / 9), 72px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background-color: var(--website-bg-color);
  color: var(--fg-color);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 44px;
  padding: 0 16px;
  border-bottom: 1px solid var(--nav-border-color);
}

.nav-title {
  font-size: 18px;
  font-weight: bold;
  user-select: none;
}

.icon-button {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 36px;
  height: 36px;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 18px;
  color: var(--undoredo-fg-color);
  background-color: var(--undoredo-bg-color);
  cursor: pointer;
}

.icon-button:hover {
  color: var(--undoredo-hover-fg-color);
  background-color: var(--undoredo-hover-bg-color);
}

.icon-button:active {
  background-color: var(--undoredo-active-bg-color);
  transition: background-color 0.1s ease-in;
}

.icon-button:disabled {
  color: var(--undoredo-disabled-color);
  background-color: unset;
  cursor: default;
}

.icon-button svg { width: 20px; height: 20px; }

.game {
  width: calc(9 * var(--sq) + 12px);
  margin: 0 auto;
  padding: 20px 0 32px;
}

.status {
  display: flex;
  align-items: center;
  height: 36px;
}

.status-left, .status-middle, .status-right {
  display: flex;
  align-items: center;
  flex: 1;
  height: 100%;
  gap: 2px;
}

.status-middle { justify-content: center; flex: 2; }
.status-right { justify-content: flex-end; }

.num-moves {
  padding: 0 6px;
  color: var(--num-moves-color);
  font-family: monospace;
  font-size: 16px;
  font-weight: bold;
  user-select: none;
}

.player-icon { width: 22px; height: 22px; margin: 5px; }
.player-icon.x, .x .player-symbol { color: var(--x-status-color); }
.player-icon.o, .o .player-symbol { color: var(--o-status-color); }

.player-symbol {
  display: inline-block;
  width: 24px;
  font-size: 20px;
  font-weight: bold;
  user-select: none;
}

.turn { display: flex; align-items: center; }

.state-value {
  padding: 0 6px;
  font-family: monospace;
  font-size: 16px;
  font-weight: bold;
  user-select: none;
}

.uttt-result { font-size: 20px; font-weight: bold; user-select: none; }
.state-value.x, .uttt-result.x { color: var(--x-status-color); }
.state-value.o, .uttt-result.o { color: var(--o-status-color); }
.uttt-result.draw { color: var(--draw-status-color); }

.progress {
  position: relative;
  height: 3px;
  overflow: hidden;
  border-radius: 1px;
}

.progress .bar {
  position: absolute;
  width: 30%;
  height: 100%;
  left: -30%;
}

.progress.active .bar { animation: slide 1.1s ease-in-out infinite; }
.progress.x .bar { background-color: var(--x-status-color); }
.progress.o .bar { background-color: var(--o-status-color); }

@keyframes slide {
  from { left: -30%; }
  to { left: 100%; }
}

.board { margin: 8px auto 16px; }

.supergame {
  display: grid;
  grid-template-columns: repeat(3, auto);
  justify-content: center;
  background-color: var(--supergame-bg-color);
}

.subgame {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, auto);
}

.subgame:nth-child(3n + 2) {
  border-left: 3px solid var(--subgame-border-color);
  border-right: 3px solid var(--subgame-border-color);
}

.subgame:nth-child(n + 4):nth-child(-n + 6) {
  border-top: 3px solid var(--subgame-border-color);
  border-bottom: 3px solid var(--subgame-border-color);
}

.subgame.result.x { background-color: var(--x-subgame-result-bg-color); }
.subgame.result.o { background-color: var(--o-subgame-result-bg-color); }
.subgame.result.draw { background-color: var(--draw-subgame-result-bg-color); }

.result-icon {
  display: none;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.result .result-icon { display: block; }
.result.x .result-icon { padding: 4%; color: var(--x-subgame-symbol-color); opacity: 0.15; }
.result.o .result-icon { padding: 3%; color: var(--o-subgame-symbol-color); opacity: 0.2; }
.result.draw .result-icon { padding: 8%; color: var(--draw-subgame-symbol-color); opacity: 0.25; }

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  width: var(--sq);
  height: var(--sq);
  box-sizing: content-box;
}

.square:nth-child(3n + 2) {
  border-left: 1px solid var(--square-border-color);
  border-right: 1px solid var(--square-border-color);
}

.square:nth-child(n + 4):nth-child(-n + 6) {
  border-top: 1px solid var(--square-border-color);
  border-bottom: 1px solid var(--square-border-color);
}

.square .probability {
  color: var(--square-probability-color);
  font-size: calc(var(--sq) * 0.25);
  user-select: none;
}

.square .probability.top {
  color: var(--square-probability-top-color);
  font-weight: bold;
}

.square.legal.x { background-color: var(--x-square-legal-color); }
.square.legal.o { background-color: var(--o-square-legal-color); }
.square.legal.clickable { cursor: pointer; }
.square.legal.clickable.x:hover, .square.legal.clickable.x:focus-visible { background-color: var(--x-square-hover-color); }
.square.legal.clickable.o:hover, .square.legal.clickable.o:focus-visible { background-color: var(--o-square-hover-color); }
.square.legal.clickable:focus-visible { outline: none; }

.square.prev { outline-offset: -3px; }
.square.prev.x { outline: 3px solid var(--x-square-outline-color); }
.square.prev.o { outline: 3px solid var(--o-square-outline-color); }

.symbol-icon { width: 100%; height: 100%; }
.symbol-icon.x { padding: 28%; color: var(--x-square-symbol-color); }
.symbol-icon.o { padding: 25%; color: var(--o-square-symbol-color); }

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 12px;
}

.controls label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
  user-select: none;
}

.controls label.x { color: var(--x-status-color); }
.controls label.o { color: var(--o-status-color); }

select, .text-button {
  max-width: 100%;
  height: 32px;
  padding: 0 8px;
  border: 1px solid var(--control-border-color);
  border-radius: 6px;
  color: var(--fg-color);
  background-color: var(--control-bg-color);
  font: inherit;
  font-size: 14px;
  font-weight: normal;
}

select { max-width: min(60vw, 260px); }
.text-button { cursor: pointer; }
.text-button:hover { background-color: var(--control-hover-bg-color); }

.info {
  min-height: 1.4em;
  margin: 14px 0 0;
  font-size: 14px;
  text-align: center;
  color: var(--muted-color);
  overflow-wrap: anywhere;
}

.info.error { color: var(--error-color); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="sym-x" viewBox="0 0 100 100"><path d="M49 39Q50 40 51 39L87 3A1 1 0 0197 13L61 49Q60 50 61 51L97 87A1 1 0 0187 97L51 61Q50 60 49 61L13 97A1 1 0 013 87L39 51Q40 50 39 49L3 13A1 1 0 0113 3Z" fill="currentColor"/></symbol>
  <symbol id="sym-o" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="12" fill="none"/></symbol>
  <symbol id="sym-draw" viewBox="0 0 100 60"><path d="M0 2Q0 0 2 0L98 0Q100 0 100 2L100 18Q100 20 98 20L2 20Q0 20 0 18ZM0 42Q0 40 2 40L98 40Q100 40 100 42L100 58Q100 60 98 60L2 60Q0 60 0 58Z" fill="currentColor"/></symbol>
  <symbol id="sym-ai" viewBox="0 0 200 200"><path d="M15 20 185 20Q200 20 200 35L200 165Q200 180 185 180L15 180Q0 180 0 165L0 35Q0 20 15 20ZM108.85 155.04 131.65 155.04 91.65 44.96 64.47 44.96 24.3 155.04 47.35 155.04 57.13 126.91 99.08 126.91 108.85 155.04ZM78.05 61.91 93.93 109.56 62.28 109.56 78.05 61.91ZM146.8 155.04 169.85 155.04 169.85 44.96 146.8 44.96 146.8 155.04Z" fill="currentColor"/></symbol>
  <symbol id="sym-human" viewBox="0 0 200 200"><path d="M100 86A1 1 0 00100 9A1 1 0 00100 86ZM100 91Q66 93 46 123Q35 141 32 157Q30 171 30 181C65 196 135 196 170 181Q170 171 168 157Q165 141 154 123Q134 93 100 91Z" fill="currentColor"/></symbol>
  <symbol id="sym-undo" viewBox="0 0 60 50"><path d="M29 0 0 20 29 40 29 28C48 28 55 38 59 50C61 25 48 12 29 12Z" fill="currentColor"/></symbol>
  <symbol id="sym-redo" viewBox="0 0 60 50"><path d="M31 0 60 20 31 40 31 28C12 28 5 38 1 50C-1 25 12 12 31 12Z" fill="currentColor"/></symbol>
  <symbol id="sym-theme" viewBox="0 0 44 44"><path d="M22 0A1 1 0 0122 44 1 1 0 0122 0ZM22 6A1 1 0 0022 38V6Z" fill="currentColor"/></symbol>
</svg>

<header class="nav">
  <span class="nav-title">Ultimate Tic-Tac-Toe</span>
  <button class="icon-button" id="theme" type="button" title="Switch theme"><svg><use href="#sym-theme"/></svg></button>
</header>

<main class="game">
  <div class="status">
    <div class="status-left">
      <button class="icon-button" id="undo" type="button" title="Undo (back to your last turn)"><svg><use href="#sym-undo"/></svg></button>
      <button class="icon-button" id="redo" type="button" title="Redo"><svg><use href="#sym-redo"/></svg></button>
    </div>
    <div class="status-middle" id="status-middle"></div>
    <div class="status-right">
      <span class="state-value" id="value" title="Value for X from the hint agent"></span>
      <span class="num-moves" id="num-moves" title="Moves played"></span>
    </div>
  </div>
  <div class="progress" id="progress"><div class="bar"></div></div>
  <div class="board"><div class="supergame" id="board"></div></div>
  <div class="controls">
    <label class="x">X <select id="player-x"></select></label>
    <label class="o">O <select id="player-o"></select></label>
    <button class="text-button" id="swap" type="button" title="Swap who plays X and O">Swap</button>
    <label>Hints <select id="hints"></select></label>
    <button class="text-button" id="new-game" type="button">New game</button>
  </div>
  <p class="info" id="info"></p>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';

// Moves are indices board * 9 + square, boards and squares row-major, as on the server.
let agents = [];
let moves = [];
let redo = [];
let state = null;
let generation = 0;
let busy = null; // {kind: 'move' | 'analyse', side}
let analysis = null; // {value for the side to move, policy: Map index -> probability}
let lastPlay = null; // the agent move that led here
let error = null;
const settings = { x: 'human', o: '0', hints: 'off', theme: null };

// Stored settings, overridden by `?x=human&o=1&hints=0` in the URL (agent indices or
// human/off), so a setup can be bookmarked.
function loadSettings() {
  try {
    Object.assign(settings, JSON.parse(localStorage.getItem('uttt-serve') || '{}'));
  } catch (e) {}
  const query = new URLSearchParams(location.search);
  for (const key of ['x', 'o', 'hints']) {
    if (query.has(key)) settings[key] = query.get(key);
  }
}

function saveSettings() {
  try {
    localStorage.setItem('uttt-serve', JSON.stringify(settings));
  } catch (e) {}
}

function applyTheme() {
  const dark = settings.theme
    ? settings.theme === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

async function api(path) {
  const response = await fetch(path, { cache: 'no-store' });
  const body = await response.text();
  if (!response.ok) throw new Error(body || response.statusText);
  return JSON.parse(body);
}

const movesParam = () => moves.join('.');
const sideAt = (ply) => (ply % 2 === 0 ? 'x' : 'o');
const isHuman = (side) => settings[side] === 'human';
const moveName = (i) => {
  const b = Math.floor(i / 9), s = i % 9;
  return `r${Math.floor(b / 3)}c${b % 3}/r${Math.floor(s / 3)}c${s % 3}`;
};
const agentName = (i) => agents[Number(i)] ?? `agent ${i}`;
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function formatProbability(p) {
  const s = (Math.round(p * 10000) / 100).toFixed(2).slice(0, 5);
  return s === '0.00' ? '0.0' : s;
}

function formatValue(v) {
  let s = (Math.round(v * 10000) / 100).toFixed(2);
  if (s[0] !== '-') s = '+' + s;
  s = s.slice(0, 6);
  if (s.endsWith('100.0')) return s.slice(0, 4);
  if (s === '+0.00' || s === '-0.00') return '0.0';
  return s;
}

function svgUse(symbol, className) {
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('class', className);
  const use = document.createElementNS(SVG, 'use');
  use.setAttribute('href', symbol);
  svg.appendChild(use);
  return svg;
}

const subgames = [];
const squares = [];

function buildBoard() {
  const board = $('board');
  for (let b = 0; b < 9; b++) {
    const subgame = document.createElement('div');
    subgame.className = 'subgame';
    for (let s = 0; s < 9; s++) {
      const index = b * 9 + s;
      const square = document.createElement('div');
      square.className = 'square';
      square.addEventListener('click', () => humanMove(index));
      square.addEventListener('keydown', (event) => {
        if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          humanMove(index);
        }
      });
      subgame.appendChild(square);
      squares.push(square);
    }
    const icon = svgUse('#sym-x', 'result-icon');
    subgame.appendChild(icon);
    subgames.push({ element: subgame, icon });
    board.appendChild(subgame);
  }
}

function fillSelect(select, first, value) {
  select.replaceChildren();
  const add = (val, text) => {
    const option = document.createElement('option');
    option.value = val;
    option.textContent = text;
    select.appendChild(option);
  };
  add(first[0], first[1]);
  agents.forEach((name, i) => add(String(i), name));
  select.value = [...select.options].some((o) => o.value === value) ? value : first[0];
  return select.value;
}

function render() {
  const canClick = state && !state.outcome && isHuman(state.toMove);
  let top = -1;
  if (analysis) {
    for (const p of analysis.policy.values()) top = Math.max(top, p);
  }
  for (let b = 0; b < 9; b++) {
    const result = state ? state.boards[b] : '.';
    const { element, icon } = subgames[b];
    element.className = 'subgame' + (result === '.' ? '' : ` result ${result === 'd' ? 'draw' : result}`);
    if (result !== '.') {
      icon.firstChild.setAttribute('href', result === 'd' ? '#sym-draw' : `#sym-${result}`);
    }
  }
  for (let i = 0; i < 81; i++) {
    const square = squares[i];
    const cell = state ? state.cells[i] : '.';
    const legal = state && state.legal.includes(i);
    let className = 'square';
    square.replaceChildren();
    square.removeAttribute('tabindex');
    if (cell !== '.') {
      if (state.last === i) className += ` prev ${cell}`;
      square.appendChild(svgUse(`#sym-${cell}`, `symbol-icon ${cell}`));
    } else if (legal) {
      className += ` legal ${state.toMove}`;
      if (canClick) {
        className += ' clickable';
        square.tabIndex = 0;
      }
      if (analysis && analysis.policy.has(i)) {
        const p = analysis.policy.get(i);
        const span = document.createElement('span');
        span.className = 'probability' + (p === top ? ' top' : '');
        span.textContent = formatProbability(p);
        square.appendChild(span);
      }
    }
    square.className = className;
  }
  renderStatus();
}

function renderStatus() {
  const middle = $('status-middle');
  middle.replaceChildren();
  if (state && state.outcome) {
    const span = document.createElement('span');
    span.className = `uttt-result ${state.outcome}`;
    span.textContent = state.outcome === 'draw' ? 'Draw' : `${state.outcome.toUpperCase()} won`;
    middle.appendChild(span);
  } else if (state) {
    const side = state.toMove;
    const turn = document.createElement('div');
    turn.className = `turn ${side}`;
    turn.title = isHuman(side) ? 'Your move' : agentName(settings[side]);
    turn.appendChild(svgUse(isHuman(side) ? '#sym-human' : '#sym-ai', `player-icon ${side}`));
    const symbol = document.createElement('span');
    symbol.className = 'player-symbol';
    symbol.textContent = side.toUpperCase();
    turn.appendChild(symbol);
    middle.appendChild(turn);
  }
  $('num-moves').textContent = moves.length;
  const value = $('value');
  if (analysis && state && !state.outcome && analysis.value !== null) {
    const forX = state.toMove === 'x' ? analysis.value : -analysis.value;
    value.textContent = formatValue(forX);
    value.className = 'state-value' + (forX > 0 ? ' x' : forX < 0 ? ' o' : '');
  } else {
    value.textContent = '';
  }
  $('undo').disabled = moves.length === 0;
  $('redo').disabled = redo.length === 0;
  const progress = $('progress');
  progress.className = 'progress' + (busy ? ` active ${busy.side}` : '');

  const info = $('info');
  info.className = 'info' + (error ? ' error' : '');
  if (error) {
    info.textContent = error;
  } else if (busy && busy.kind === 'move') {
    info.textContent = `${agentName(settings[busy.side])} is thinking…`;
  } else if (state && !state.outcome && !isHuman(state.toMove) && redo.length) {
    info.textContent = 'Browsing history: redo, or change a player, to continue.';
  } else if (lastPlay) {
    const p = lastPlay.policy.find(([m]) => m === lastPlay.move);
    const how = lastPlay.book
      ? 'from its book'
      : p && lastPlay.policy.length > 1
        ? `${formatProbability(p[1])}% of its policy`
        : '';
    const seconds = (lastPlay.ms / 1000).toFixed(2);
    info.textContent = `${lastPlay.side.toUpperCase()} · ${agentName(lastPlay.agent)} played ${moveName(lastPlay.move)}${how ? ' ' + how : ''} in ${seconds} s`;
  } else if (busy && busy.kind === 'analyse') {
    info.textContent = `${agentName(settings.hints)} is analysing…`;
  } else {
    info.textContent = '';
  }
}

function writeHash() {
  history.replaceState(null, '', location.pathname + location.search + (moves.length ? `#${movesParam()}` : ''));
}

async function refresh() {
  const gen = ++generation;
  busy = null;
  analysis = null;
  error = null;
  writeHash();
  try {
    const next = await api(`/api/state?moves=${movesParam()}`);
    if (gen !== generation) return;
    state = next;
  } catch (e) {
    if (gen !== generation) return;
    error = e.message;
    render();
    return;
  }
  render();
  step(gen);
}

async function step(gen) {
  if (state.outcome) return;
  const side = state.toMove;
  if (!isHuman(side)) {
    if (redo.length) return;
    busy = { kind: 'move', side };
    render();
    if (!isHuman(side === 'x' ? 'o' : 'x')) await sleep(300);
    if (gen !== generation) return;
    try {
      const r = await api(`/api/move?agent=${settings[side]}&moves=${movesParam()}`);
      if (gen !== generation) return;
      lastPlay = { side, agent: settings[side], ...r };
      moves.push(r.move);
      refresh();
    } catch (e) {
      if (gen !== generation) return;
      busy = null;
      error = e.message;
      render();
    }
  } else if (settings.hints !== 'off') {
    busy = { kind: 'analyse', side };
    render();
    try {
      const r = await api(`/api/analyse?agent=${settings.hints}&moves=${movesParam()}`);
      if (gen !== generation) return;
      busy = null;
      analysis = { value: r.value, policy: new Map(r.policy) };
      render();
    } catch (e) {
      if (gen !== generation) return;
      busy = null;
      error = e.message;
      render();
    }
  }
}

function humanMove(index) {
  if (!state || state.outcome || !isHuman(state.toMove) || !state.legal.includes(index)) return;
  moves.push(index);
  redo = [];
  lastPlay = null;
  refresh();
}

// Back to the previous position where a human is to move (one move if nobody is human).
function undo() {
  if (!moves.length) return;
  const anyHuman = isHuman('x') || isHuman('o');
  redo.push(moves.pop());
  while (anyHuman && moves.length && !isHuman(sideAt(moves.length))) redo.push(moves.pop());
  lastPlay = null;
  refresh();
}

function redoMoves() {
  if (!redo.length) return;
  moves.push(redo.pop());
  while (redo.length && !isHuman(sideAt(moves.length))) moves.push(redo.pop());
  lastPlay = null;
  refresh();
}

function newGame() {
  moves = [];
  redo = [];
  lastPlay = null;
  refresh();
}

function readHash() {
  const hash = location.hash.slice(1);
  moves = hash ? hash.split('.').map(Number).filter((n) => Number.isInteger(n)) : [];
}

async function main() {
  loadSettings();
  applyTheme();
  buildBoard();
  readHash();
  try {
    agents = (await api('/api/agents')).agents;
  } catch (e) {
    error = `could not list the agents: ${e.message}`;
    render();
    return;
  }
  settings.x = fillSelect($('player-x'), ['human', 'Human'], settings.x);
  settings.o = fillSelect($('player-o'), ['human', 'Human'], settings.o);
  settings.hints = fillSelect($('hints'), ['off', 'Off'], settings.hints);
  for (const [id, key] of [['player-x', 'x'], ['player-o', 'o'], ['hints', 'hints']]) {
    $(id).addEventListener('change', (event) => {
      settings[key] = event.target.value;
      saveSettings();
      refresh();
    });
  }
  $('swap').addEventListener('click', () => {
    [settings.x, settings.o] = [settings.o, settings.x];
    $('player-x').value = settings.x;
    $('player-o').value = settings.o;
    saveSettings();
    refresh();
  });
  $('new-game').addEventListener('click', newGame);
  $('undo').addEventListener('click', undo);
  $('redo').addEventListener('click', redoMoves);
  $('theme').addEventListener('click', () => {
    settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    saveSettings();
    applyTheme();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  window.addEventListener('hashchange', () => {
    if (location.hash.slice(1) === movesParam()) return;
    readHash();
    redo = [];
    lastPlay = null;
    refresh();
  });
  refresh();
}

main();
</script>
</body>
</html>
