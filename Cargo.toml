[package]
name = "brut3"
version = "0.1.0"
edition = "2024"
description = "An Ultimate Tic-Tac-Toe agent (in Burn + Rust)"

[dependencies]
burn = { version = "0.22.1", optional = true, default-features = false }
clap = { version = "4", features = ["derive"] }
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The training's experiment log (see nn::train): the same crates burn-train's own logger uses.
log = { version = "0.4", optional = true }
tracing-appender = { version = "0.2.5", optional = true }
tracing-core = { version = "0.1.36", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }

[features]
# Default: every backend that builds with no extra system requirements.
default = ["flex", "wgpu"]
# Every backend, without fusion: what development and most runs build (`--features full`).
full = ["flex", "wgpu", "cuda", "cpu-mlir"]
# Pulls in burn itself plus the pieces every backend needs: burn-train (autodiff, datasets, the
# Learner with its TUI dashboard) for training. Backend selection among the compiled backends
# is built into burn 0.22's `Device`. burn's default features are off so that kernel fusion
# stays off on the CubeCL backends unless `fusion` asks for it.
nn = [
    "dep:burn",
    "burn/std",
    "burn/autotune",
    # Caches compiled CubeCL kernels on disk (~/.cache/cubecl) across runs. Without it every
    # process recompiles every kernel shape it meets, on the thread that also launches kernels:
    # a generation went from 47 s warm to 73-90 s cold on an RTX 2080.
    "burn/persistence",
    "burn/train",
    "burn/tui",
    "dep:serde",
    "dep:serde_json",
    "dep:log",
    "dep:tracing-appender",
    "dep:tracing-core",
    "dep:tracing-subscriber",
]
# Pure-Rust CPU backend.
flex = ["nn", "burn/flex"]
# Portable GPU backend (Vulkan/Metal/DX12); no SDK needed at build time.
wgpu = ["nn", "burn/wgpu"]
# Opt-in backends, each needing something on the system:
# CUDA toolkit + nvcc (CUDA_PATH) and nccl.h at build time.
cuda = ["nn", "burn/cuda"]
# CubeCL CPU backend; downloads a prebuilt LLVM/MLIR 20 on first build.
cpu-mlir = ["nn", "burn/cpu"]
# Kernel fusion on the CubeCL backends (cuda, wgpu, cpu-mlir). burn decides it at compile time
# for every device, and it pays only for training: on burn 0.22.1 a training step is about 16%
# faster (medium nnue 6.9 against 8.2 ms on an RTX 2080), the inference server 40-70% slower
# (see README). Build it in the `fusion` profile, so that it never replaces the unfused build:
# `cargo build --profile fusion --features full,fusion` (target/fusion/brut3).
fusion = ["nn", "burn/fusion"]

# Component timings with a small harness of their own; see benches/README.md.
[[bench]]
name = "micro"
harness = false

# Release with incremental compilation of this crate, for edit-build cycles:
# `cargo build --profile quick --features full` builds target/quick/brut3. A rebuild after an
# edit takes 2-4 s instead of ~16 s, but the code runs about a third slower (random playouts
# +28%, search work per simulation +35%), because incremental builds cannot inline across
# their many small codegen units. Use release for self-play, training and benchmarks.
# Dependencies are never compiled incrementally; they are built once more for this profile.
[profile.quick]
inherits = "release"
incremental = true

# Release with kernel fusion, for training (with `--features full,fusion`; see `fusion`): its
# own target directory, so that switching between the fused and unfused builds rebuilds neither.
[profile.fusion]
inherits = "release"

[profile.dev.package."*"]
# No debug info for dependencies (burn, cubecl, ...), which are rarely stepped into: a full
# test build takes about a sixth less CPU time and an eighth less peak memory. brut3 itself
# keeps full debug info.
debug = false
